name: Plugin and native checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - if: runner.os == 'macOS'
        run: npm run native:check && npm run native:build
